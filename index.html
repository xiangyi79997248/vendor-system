<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採購廠商及工程聯繫資料</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-btn.active { border-bottom: 3px solid #059669; color: #059669; font-weight: 600; }
    .agency-tab.active { border-bottom: 3px solid #059669; color: #059669; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 pt-3">
      <div class="flex flex-wrap justify-between items-center gap-3 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📋</span>
          <h1 class="text-xl font-bold tracking-wide">採購廠商及工程聯繫資料</h1>
          <span id="syncStatusBadge" class="text-[11px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/50 flex items-center gap-1">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> 雲端連線中
          </span>
        </div>
      </div>
      <div class="flex gap-1 overflow-x-auto">
        <button id="majorVendorBtn" onclick="switchMajor('vendor')" class="px-5 py-2.5 bg-slate-100 text-emerald-800 font-bold rounded-t-lg transition whitespace-nowrap cursor-pointer">🏢 採購廠商</button>
        <button id="majorAgencyBtn" onclick="switchMajor('agency')" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-emerald-100 font-semibold rounded-t-lg transition whitespace-nowrap cursor-pointer">🏛️ 工程聯繫</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <div id="majorVendor">
      <div class="flex flex-wrap items-center gap-2 mb-5">
        <button id="navQueryBtn" onclick="switchMainView('query')" class="bg-emerald-800 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 border border-emerald-600"><span>🔍</span> 廠商查詢</button>
        <button id="navSiteBtn" onclick="switchMainView('site')" class="bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 border border-emerald-400"><span>🏗️</span> 案場查詢</button>
        <button id="navEditBtn" onclick="prepareCreateNew()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 border border-emerald-400"><span>➕</span> 建立/修改</button>
      </div>

      <section id="viewQuery" class="space-y-5">
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-3"><span>🔍</span> 採購廠商條件查詢</h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="md:col-span-2"><input type="text" id="queryKeyword" oninput="filterVendors()" placeholder="關鍵字即時查詢..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><select id="queryCategory" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"></select></div>
            <div><select id="queryStatus" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"><option value="">全部狀態</option><option value="是">配合中</option><option value="否">已停止</option></select></div>
          </div>
          <div class="flex justify-between items-center mt-4 pt-3 border-t text-xs text-slate-500">
            <span id="resultCount">共 0 筆資料</span>
            <div class="flex gap-2">
              <button onclick="fetchCloudData(true)" class="text-emerald-700 hover:underline font-semibold">🔄 手動同步</button>
              <button onclick="exportData()" class="hover:text-emerald-700 underline">匯出(JSON)</button>
              <label class="hover:text-emerald-700 underline cursor-pointer">匯入 <input type="file" onchange="importData(event)" class="hidden"></label>
            </div>
          </div>
        </div>
        <div id="queryResultGroups" class="space-y-6"></div>
      </section>

      <section id="viewSite" class="hidden space-y-5">
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
          <input type="text" id="siteSearchInput" oninput="renderSiteQuery()" placeholder="🔍 輸入案場名稱..." class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm">
          <div id="siteBadges" class="mt-3 flex flex-wrap gap-1.5"></div>
        </div>
        <div id="siteResultContainer" class="space-y-4"></div>
      </section>

      <section id="viewEdit" class="hidden">
        <div class="bg-white p-5 rounded-2xl border">
          <div class="flex justify-between pb-4 border-b">
            <h2 id="formTitle" class="text-xl font-bold">建立資料</h2>
            <button onclick="switchMainView('query')" class="text-sm text-slate-500">✕ 返回</button>
          </div>
          <form id="vendorForm" onsubmit="saveVendor(event)" class="mt-4 space-y-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <input type="text" id="vCode" required placeholder="代號" class="border rounded px-3 py-2 text-sm">
              <input type="text" id="vName" required placeholder="名稱" class="border rounded px-3 py-2 text-sm">
              <input type="text" id="vTaxId" placeholder="統編" class="border rounded px-3 py-2 text-sm">
              <input type="text" id="vCategory" placeholder="類別" class="border rounded px-3 py-2 text-sm">
            </div>
            <textarea id="vWorkItems" class="w-full border rounded p-2 text-sm" placeholder="施工項目"></textarea>
            <div class="flex gap-3 justify-end pt-4">
              <button type="button" onclick="switchMainView('query')" class="px-4 py-2 border rounded">返回</button>
              <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded">確認儲存</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwXxXu6NHVfQntAJKJaHswCExUCRYYITArdVaNR5oer5YtdplV2l85NM6Q9_uAvJBnn/exec";
    let vendors = JSON.parse(localStorage.getItem('vendor_system_data')) || [];

    function updateBadge(status, text) {
      const badge = document.getElementById('syncStatusBadge');
      badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full ${status === 'online' ? 'bg-emerald-300' : 'bg-rose-300'}"></span> ${text}`;
    }

    async function fetchCloudData(isManual = false) {
      updateBadge('syncing', '同步中...');
      try {
        const response = await fetch(CLOUD_API_URL + '?t=' + Date.now());
        const data = await response.json();
        vendors = data;
        localStorage.setItem('vendor_system_data', JSON.stringify(vendors));
        filterVendors();
        updateBadge('online', '雲端已同步');
        if (isManual) alert('同步成功');
      } catch (err) {
        updateBadge('error', '離線模式');
        if (isManual) alert('連線失敗');
      }
    }

    async function syncToCloud() {
      try {
        await fetch(CLOUD_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(vendors)
        });
        updateBadge('online', '雲端已儲存');
      } catch (err) {
        updateBadge('error', '儲存失敗');
      }
    }

    function saveVendor(e) {
      e.preventDefault();
      // 這裡簡化了儲存邏輯，實際應用請補全所有欄位
      const vData = { id: Date.now().toString(), name: document.getElementById('vName').value };
      vendors.unshift(vData);
      localStorage.setItem('vendor_system_data', JSON.stringify(vendors));
      syncToCloud();
      switchMainView('query');
    }

    function switchMajor(section) { /* 切換邏輯 */ }
    function switchMainView(view) { /* 視圖邏輯 */ }
    function filterVendors() { /* 過濾邏輯 */ }
    function exportData() { /* 匯出邏輯 */ }
    function importData(e) { /* 匯入邏輯 */ }

    // 初始化
    fetchCloudData();
  </script>
</body>
</html>
