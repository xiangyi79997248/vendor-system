<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採購廠商及工程聯繫資料</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-btn.active {
      border-bottom: 3px solid #059669;
      color: #059669;
      font-weight: 600;
    }
    .agency-tab.active {
      border-bottom: 3px solid #059669;
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 頂部主選單 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 pt-3">
      <div class="flex flex-wrap justify-between items-center gap-3 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📋</span>
          <h1 class="text-xl font-bold tracking-wide">採購廠商及工程聯繫資料</h1>
          <span id="syncStatusBadge" class="text-[11px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/50 flex items-center gap-1">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> 雲端連線中
          </span>
        </div>
      </div>
      
      <!-- 兩大版塊切換頁籤 -->
      <div class="flex gap-1 overflow-x-auto">
        <button id="majorVendorBtn" onclick="switchMajor('vendor')" class="px-5 py-2.5 bg-slate-100 text-emerald-800 font-bold rounded-t-lg transition whitespace-nowrap cursor-pointer">
          🏢 採購廠商聯繫資料
        </button>
        <button id="majorAgencyBtn" onclick="switchMajor('agency')" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-emerald-100 font-semibold rounded-t-lg transition whitespace-nowrap cursor-pointer">
          🏛️ 工程聯繫資料
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 md:p-6">

    <!-- ==================== 大版塊 1：採購廠商聯繫資料 ==================== -->
    <div id="majorVendor">
      
      <!-- 廠商功能切換按鈕 -->
      <div class="flex flex-wrap items-center gap-2 mb-5">
        <button id="navQueryBtn" onclick="switchMainView('query')" class="bg-emerald-800 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 border border-emerald-600">
          <span>🔍</span> 廠商查詢
        </button>
        <button id="navSiteBtn" onclick="switchMainView('site')" class="bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 border border-emerald-400">
          <span>🏗️</span> 案場廠商查詢
        </button>
        <button id="navEditBtn" onclick="prepareCreateNew()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 border border-emerald-400">
          <span>➕</span> 建立 / 修改廠商
        </button>
      </div>

      <!-- 視圖 1：廠商條件查詢專區 -->
      <section id="viewQuery" class="space-y-5">
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
            <span>🔍</span> 採購廠商條件查詢
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">關鍵字搜尋 (代號/名稱/統編/電話/項目/網址/聯絡人/會計)</label>
              <input type="text" id="queryKeyword" oninput="filterVendors()" placeholder="輸入關鍵字即時查詢..." 
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
              <select id="queryCategory" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">配合狀態</label>
              <select id="queryStatus" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                <option value="">全部狀態</option>
                <option value="是">配合中</option>
                <option value="否">已停止配合</option>
              </select>
            </div>
          </div>

          <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500">
            <span id="resultCount">共 0 筆資料</span>
            <div class="flex gap-2">
              <button onclick="fetchCloudData(true)" class="text-emerald-700 hover:underline font-semibold flex items-center gap-1">
                <span>🔄</span> 手動重新整理雲端
              </button>
              <span>|</span>
              <button onclick="exportData()" class="hover:text-emerald-700 underline">匯出備份 (JSON)</button>
              <span>|</span>
              <label class="hover:text-emerald-700 underline cursor-pointer">
                匯入備份 <input type="file" onchange="importData(event)" class="hidden">
              </label>
            </div>
          </div>
        </div>

        <div id="queryResultGroups" class="space-y-6"></div>
      </section>

      <!-- 視圖 2：案場履歷查詢專區 -->
      <section id="viewSite" class="hidden space-y-5">
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
            <span>🏗️</span> 案場履歷與配合廠商反查
          </h2>
          <p class="text-xs text-slate-500 mb-4">輸入案場關鍵字，自動找出該工程配合過的各工種與廠商明細。</p>
          
          <div class="flex gap-3">
            <div class="flex-1">
              <input type="text" id="siteSearchInput" oninput="renderSiteQuery()" placeholder="🔍 輸入案場名稱關鍵字..." 
                class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <button onclick="document.getElementById('siteSearchInput').value=''; renderSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空搜尋</button>
          </div>

          <div class="mt-3 pt-3 border-t border-slate-100">
            <span class="text-xs text-slate-400 mr-2">已有案場快捷選取：</span>
            <div id="siteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
          </div>
        </div>

        <div id="siteResultContainer" class="space-y-4"></div>
      </section>

      <!-- 視圖 3：建立 / 修改廠商表單 -->
      <section id="viewEdit" class="hidden">
        <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
          
          <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
            <div>
              <span id="formModeTag" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">新增廠商</span>
              <h2 id="formTitle" class="text-xl font-bold text-slate-800 mt-1">建立採購廠商資料</h2>
            </div>
            <button onclick="switchMainView('query')" class="text-sm text-slate-500 hover:text-slate-800 cursor-pointer">✕ 返回查詢列表</button>
          </div>

          <form id="vendorForm" onsubmit="saveVendor(event)">
            
            <!-- 主要識別資訊 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-5">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">廠商代號 (可選可自填) *</label>
                <input list="codeOptions" id="vCode" required onchange="handleCodeSelect(this.value)" placeholder="自動編號或選取..." 
                  class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                <datalist id="codeOptions"></datalist>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">廠商名稱 *</label>
                <input type="text" id="vName" required class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">統一編號</label>
                <input type="text" id="vTaxId" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              </div>
              
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別 (可選可自填)</label>
                <input list="categoryOptions" id="vCategory" placeholder="輸入或選取類別..." 
                  class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                <datalist id="categoryOptions"></datalist>
              </div>

              <div class="col-span-2 md:col-span-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">施工項目</label>
                <input type="text" id="vWorkItems" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：水電配管、工程險、鋼筋綁紮...">
              </div>
            </div>

            <!-- 分頁切換鈕 -->
            <div class="flex border-b border-slate-200 mb-4 text-sm overflow-x-auto">
              <button type="button" onclick="switchSubTab('subtab-basic')" class="tab-btn active px-4 py-2 text-slate-500 whitespace-nowrap cursor-pointer">基本資料</button>
              <button type="button" onclick="switchSubTab('subtab-payment')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap cursor-pointer">請款資訊</button>
              <button type="button" onclick="switchSubTab('subtab-quote')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap cursor-pointer">詢價內容</button>
              <button type="button" onclick="switchSubTab('subtab-sites')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap cursor-pointer">使用案場</button>
            </div>

            <!-- 分頁 1: 基本資料 -->
            <div id="subtab-basic" class="subtab-content space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs text-slate-600 mb-1">廠商市話</label>
                  <input type="text" id="vTel" class="w-full border border-slate-300 rounded px-2.5 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-xs text-slate-600 mb-1">廠商傳真</label>
                  <input type="text" id="vFax" class="w-full border border-slate-300 rounded px-2.5 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-xs text-slate-600 mb-1">Line ID</label>
                  <input type="text" id="vLineId" class="w-full border border-slate-300 rounded px-2.5 py-2 text-sm">
                </div>
              </div>

              <!-- 聯絡人 (1) -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h4 class="text-xs font-bold text-slate-700">聯絡人 (1)</h4>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                  <input type="text" id="c1Name" placeholder="姓名" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1Title" placeholder="職稱" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1TaxId" placeholder="統編" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1Mobile" placeholder="手機" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1LineName" placeholder="Line 名稱" class="border rounded px-3 py-2 text-sm bg-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <input type="text" id="c1Tel" placeholder="電話" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1Ext" placeholder="分機" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1ContactFax" placeholder="傳真" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1Duty" placeholder="負責項目" class="border rounded px-3 py-2 text-sm bg-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                  <input type="text" id="c1Email" placeholder="E-mail" class="w-full border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c1Address" placeholder="通訊地址" class="w-full border rounded px-3 py-2 text-sm bg-white">
                </div>
              </div>

              <!-- 聯絡人 (2) -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h4 class="text-xs font-bold text-slate-700">聯絡人 (2)</h4>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                  <input type="text" id="c2Name" placeholder="姓名" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2Title" placeholder="職稱" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2TaxId" placeholder="統編" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2Mobile" placeholder="手機" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2LineName" placeholder="Line 名稱" class="border rounded px-3 py-2 text-sm bg-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <input type="text" id="c2Tel" placeholder="電話" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2Ext" placeholder="分機" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2ContactFax" placeholder="傳真" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2Duty" placeholder="負責項目" class="border rounded px-3 py-2 text-sm bg-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                  <input type="text" id="c2Email" placeholder="E-mail" class="w-full border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c2Address" placeholder="通訊地址" class="w-full border rounded px-3 py-2 text-sm bg-white">
                </div>
              </div>

              <!-- 聯絡人 (3) -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h4 class="text-xs font-bold text-slate-700">聯絡人 (3)</h4>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                  <input type="text" id="c3Name" placeholder="姓名" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3Title" placeholder="職稱" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3TaxId" placeholder="統編" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3Mobile" placeholder="手機" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3LineName" placeholder="Line 名稱" class="border rounded px-3 py-2 text-sm bg-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <input type="text" id="c3Tel" placeholder="電話" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3Ext" placeholder="分機" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3ContactFax" placeholder="傳真" class="border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3Duty" placeholder="負責項目" class="border rounded px-3 py-2 text-sm bg-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                  <input type="text" id="c3Email" placeholder="E-mail" class="w-full border rounded px-3 py-2 text-sm bg-white">
                  <input type="text" id="c3Address" placeholder="通訊地址" class="w-full border rounded px-3 py-2 text-sm bg-white">
                </div>
              </div>

              <!-- 網址與取貨地址 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">公司網址</label>
                  <input type="text" id="vWebsite" placeholder="例如：www.example.com" class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">取貨地址</label>
                  <input type="text" id="vPickupAddress" placeholder="例如：台南市安平區..." class="w-full border rounded px-3 py-2 text-sm">
                </div>
              </div>

              <!-- 名片上傳與備註 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">名片圖檔 (自動壓縮防爆容量，點擊放大 🔍)</label>
                  <div class="border border-dashed border-slate-300 rounded-lg p-3 text-center flex flex-col items-center justify-center bg-slate-50 relative">
                    <input type="file" id="vCardInput" accept="image/*" class="text-xs mb-2" onchange="handleCardUpload(event)">
                    <div class="relative cursor-pointer" onclick="openLightbox(currentCardBase64)" title="點擊放大檢視">
                      <img id="vCardPreview" class="max-h-36 rounded shadow-sm hidden border hover:opacity-90 transition" alt="預覽">
                      <div id="vCardHint" class="hidden absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">🔍 點擊放大</div>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="mb-2">
                    <span class="text-xs font-semibold text-slate-600 mr-2">是否還在配合：</span>
                    <label class="text-sm mr-4"><input type="radio" name="vActive" value="是" checked> 是</label>
                    <label class="text-sm"><input type="radio" name="vActive" value="否"> 否</label>
                  </div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                  <textarea id="vRemark" rows="4" class="w-full border rounded p-2 text-sm" placeholder="輸入廠商評價..."></textarea>
                </div>
              </div>
            </div>

            <!-- 分頁 2: 請款資訊 -->
            <div id="subtab-payment" class="subtab-content hidden space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs text-slate-600 mb-1">負責人</label>
                  <input type="text" id="pOwner" class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-xs text-slate-600 mb-1">請款銀行代號</label>
                  <input type="text" id="pBankCode" placeholder="例如：012" class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-xs text-slate-600 mb-1">請款銀行名稱</label>
                  <input type="text" id="pBankName" placeholder="例如：台北富邦銀行" class="w-full border rounded px-3 py-2 text-sm">
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs text-slate-600 mb-1">請款戶名</label>
                  <input type="text" id="pAccountName" class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-xs text-slate-600 mb-1">請款帳號</label>
                  <input type="text" id="pAccountNumber" class="w-full border rounded px-3 py-2 text-sm">
                </div>
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1">營業地址</label>
                <input type="text" id="pBizAddress" class="w-full border rounded px-3 py-2 text-sm">
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1">發票地址</label>
                <input type="text" id="pInvoiceAddress" class="w-full border rounded px-3 py-2 text-sm">
              </div>

              <!-- 請款聯絡人 (1) -->
              <div class="bg-emerald-50/60 p-4 rounded-xl border border-emerald-200 space-y-3 mt-2">
                <h4 class="text-xs font-bold text-emerald-800 flex items-center gap-1.5">
                  <span>💼</span> 請款聯絡人 (1)（例如：負責會計 / 出納）
                </h4>
                <div class="grid grid-cols-3 gap-3">
                  <input type="text" id="pc1Name" placeholder="姓名" class="bg-white border rounded px-3 py-2 text-sm">
                  <input type="text" id="pc1Title" placeholder="職稱 (如: 會計)" class="bg-white border rounded px-3 py-2 text-sm">
                  <input type="text" id="pc1Mobile" placeholder="手機" class="bg-white border rounded px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-3 gap-3">
                  <input type="text" id="pc1Tel" placeholder="市話" class="bg-white border rounded px-3 py-2 text-sm">
                  <input type="text" id="pc1Ext" placeholder="分機" class="bg-white border rounded px-3 py-2 text-sm">
                  <input type="text" id="pc1LineName" placeholder="Line 名稱" class="bg-white border rounded px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                  <input type="text" id="pc1Email" placeholder="E-mail (請款寄發票用)" class="w-full bg-white border rounded px-3 py-2 text-sm">

    async function fetchCloudData(isManual = false) {
      updateBadge('syncing', '雲端同步中...');
      try {
        const response = await fetch(CLOUD_API_URL + '?t=' + Date.now(), { method: 'GET' });
        const text = await response.text();
        if (text && text !== "[]") {
          const cloudData = JSON.parse(text);
          if (Array.isArray(cloudData) && cloudData.length > 0) {
            vendors = cloudData;
            localStorage.setItem('vendor_system_data', JSON.stringify(vendors));
            refreshCategoryOptions();
            refreshCodeOptions();
            filterVendors();
            renderSiteQuery();
            updateBadge('online', '雲端已同步');
            if (isManual) alert(`同步成功！目前共有 ${vendors.length} 筆廠商資料。`);
            return;
          }
        }
        syncToCloud();
        updateBadge('online', '已上傳初始化資料');
      } catch (err) {
        updateBadge('error', '離線暫存模式');
        if (isManual) alert('雲端連線失敗，目前顯示本機暫存資料。');
      }
    }

    async function syncToCloud() {
      updateBadge('syncing', '正在儲存至雲端...');
      try {
        await fetch(CLOUD_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(vendors)
        });
        updateBadge('online', '雲端已儲存');
      } catch (err) {
        updateBadge('error', '雲端儲存失敗(已存本機)');
      }
    }

    function getNextVendorCode() {
      if (vendors.length === 0) return '001';
      let maxNum = 0;
      vendors.forEach(v => {
        if (v.code) {
          const num = parseInt(v.code, 10);
          if (!isNaN(num) && num > maxNum) maxNum = num;
        }
      });
      const nextNum = maxNum + 1;
      return nextNum < 100 ? String(nextNum).padStart(3, '0') : String(nextNum);
    }

    function handleCardUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1000;
          let width = img.width, height = img.height;
          if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } }
          else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          currentCardBase64 = canvas.toDataURL('image/jpeg', 0.75);
          const previewImg = document.getElementById('vCardPreview');
          previewImg.src = currentCardBase64;
          previewImg.classList.remove('hidden');
          const hint = document.getElementById('vCardHint');
          if(hint) hint.classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function filterVendors() {
      const keyword = (document.getElementById('queryKeyword')?.value || '').toLowerCase();
      const category = document.getElementById('queryCategory')?.value || '';
      const status = document.getElementById('queryStatus')?.value || '';

      const filtered = vendors.filter(v => {
        const matchKeyword = !keyword || 
          (v.name && v.name.toLowerCase().includes(keyword)) ||
          (v.code && v.code.toLowerCase().includes(keyword)) ||
          (v.taxId && v.taxId.includes(keyword)) ||
          (v.workItems && v.workItems.toLowerCase().includes(keyword)) ||
          (v.c1?.name && v.c1.name.toLowerCase().includes(keyword));
        const matchCategory = !category || v.category === category;
        const matchStatus = !status || v.isActive === status;
        return matchKeyword && matchCategory && matchStatus;
      });

      const countEl = document.getElementById('resultCount');
      if(countEl) countEl.innerText = `共 ${filtered.length} 筆資料`;
      
      const container = document.getElementById('queryResultGroups');
      if(!container) return;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-white p-12 text-center text-slate-400 rounded-2xl border">查無相符的採購廠商資料</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(v => {
        const cat = v.category?.trim() || '未分類';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(v);
      });

      Object.keys(grouped).forEach(catName => {
        const catVendors = grouped[catName];
        const groupSection = document.createElement('div');
        groupSection.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4";
        groupSection.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-5 bg-emerald-600 rounded-full inline-block"></span>
              <h3 class="font-bold text-slate-800 text-lg">${catName}</h3>
              <span class="text-xs bg-emerald-50 text-emerald-700 font-semibold px-2.5 py-0.5 rounded-full border">${catVendors.length} 家</span>
            </div>
          </div>
        `;
        const grid = document.createElement('div');
        grid.className = "grid grid-cols-1 md:grid-cols-2 gap-4";

        catVendors.forEach(v => {
          const card = document.createElement('div');
          card.className = "bg-slate-50 p-4 rounded-xl border shadow-sm flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start">
                <span class="text-xs bg-white text-slate-700 px-2 py-0.5 rounded font-mono font-semibold border">${v.code || '無代號'}</span>
                <span class="text-xs font-bold ${v.isActive === '是' ? 'text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded' : 'text-rose-500 bg-rose-100 px-2 py-0.5 rounded'}">
                  ${v.isActive === '是' ? '● 配合中' : '✕ 已停止'}
                </span>
              </div>
              <h4 class="font-bold text-base text-slate-800 mt-2">${v.name}</h4>
              <p class="text-xs text-slate-600 mt-1">施工項目：${v.workItems || '未填寫'}</p>
              ${v.tel ? `<p class="text-xs text-slate-600 mt-1">📞 市話：<a href="tel:${v.tel}" class="text-emerald-600 font-medium">${v.tel}</a></p>` : ''}
            </div>
            <div class="mt-4 pt-3 border-t flex justify-between items-center">
              ${v.cardImg ? `<button onclick="openLightbox('${v.cardImg}')" class="text-xs text-emerald-600 underline">📇 名片</button>` : '<span></span>'}
              <button onclick="loadVendorToEdit('${v.id}')" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded">✏️ 檢視 / 修改</button>

    function renderSiteQuery() {
      const keyword = (document.getElementById('siteSearchInput')?.value || '').trim().toLowerCase();
      const container = document.getElementById('siteResultContainer');
      const badgesContainer = document.getElementById('siteBadges');
      if(!container) return;
      container.innerHTML = '';
      badgesContainer.innerHTML = '';

      const siteMap = {};
      vendors.forEach(v => {
        if (!v.sites) return;
        v.sites.split('\n').forEach(line => {
          let cleanLine = line.trim();
          if (!cleanLine) return;
          let siteTitle = cleanLine.replace(/^[\d\.\\(\)\\s\-]+/, '').trim();
          if (!siteTitle) return;
          if (!siteMap[cleanLine]) siteMap[cleanLine] = { displayTitle: siteTitle, matchedVendors: [] };
          siteMap[cleanLine].matchedVendors.push(v);
        });
      });

      Object.keys(siteMap).slice(0, 12).forEach(key => {
        const item = siteMap[key];
        const badge = document.createElement('button');
        badge.className = "text-xs bg-slate-100 hover:bg-emerald-100 text-slate-700 px-2.5 py-1 rounded-full border transition";
        badge.innerText = item.displayTitle;
        badge.onclick = () => { document.getElementById('siteSearchInput').value = item.displayTitle; renderSiteQuery(); };
        badgesContainer.appendChild(badge);
      });

      const matchedKeys = Object.keys(siteMap).filter(k => !keyword || k.toLowerCase().includes(keyword));
      if (matchedKeys.length === 0) {
        container.innerHTML = '<div class="bg-white p-12 text-center text-slate-400 rounded-2xl border">查無相符案場紀錄</div>';
        return;
      }

      matchedKeys.forEach(siteKey => {
        const siteData = siteMap[siteKey];
        let card = `<div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
          <h3 class="font-bold text-slate-800 text-base border-b pb-2">📍 ${siteData.displayTitle}</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
        siteData.matchedVendors.forEach(v => {
          card += `<div class="bg-slate-50 p-3 rounded-lg border text-xs">
            <span class="font-bold text-emerald-700">${v.category || '未分類'}</span>
            <h4 class="font-bold text-slate-800 text-sm mt-1">${v.name}</h4>
            <p class="text-slate-600 mt-1">項目：${v.workItems || '未備註'}</p>
          </div>`;
        });
        card += `</div></div>`;
        container.innerHTML += card;
      });
    }

    function prepareCreateAgency() {
      currentEditAgencyId = null;
      currentAgencyCardBase64 = "";
      document.getElementById('agencyForm').reset();
      document.getElementById('agCategory').value = currentAgencyTab;
      document.getElementById('agencyFormTitle').innerText = "建立工程聯繫資料";
      document.getElementById('agencyDeleteBtn').classList.add('hidden');
      document.getElementById('agCardPreview').classList.add('hidden');
      switchAgencySubView('edit');
    }

    function handleAgencyCardUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentAgencyCardBase64 = e.target.result;
        const img = document.getElementById('agCardPreview');
        img.src = currentAgencyCardBase64;
        img.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function saveAgency(e) {
      e.preventDefault();
      const cat = document.getElementById('agCategory').value;
      const item = {
        id: currentEditAgencyId || Date.now().toString(),
        name: document.getElementById('agName').value.trim(),
        tel: document.getElementById('agTel').value.trim(),
        extMobile: document.getElementById('agExtMobile').value.trim(),
        contact: document.getElementById('agContact').value.trim(),
        address: document.getElementById('agAddress').value.trim(),
        usageUnit: document.getElementById('agUsageUnit').value.trim(),
        usageTel: document.getElementById('agUsageTel').value.trim(),
        usageContact: document.getElementById('agUsageContact').value.trim(),
        usageAddress: document.getElementById('agUsageAddress').value.trim(),
        project: document.getElementById('agProject').value.trim(),
        note: document.getElementById('agNote').value.trim(),
        cardImg: currentAgencyCardBase64
      };

      if (!agencyData[cat]) agencyData[cat] = [];

      if (currentEditAgencyId) {
        Object.keys(agencyData).forEach(k => {
          agencyData[k] = agencyData[k].filter(x => x.id !== currentEditAgencyId);
        });
      }
      agencyData[cat].unshift(item);

      localStorage.setItem('agency_system_data', JSON.stringify(agencyData));
      alert('儲存成功！');
      switchAgencyTab(cat);
    }

    function editAgency(id) {
      let target = null;
      let foundCat = '';
      Object.keys(agencyData).forEach(cat => {
        const found = agencyData[cat].find(x => x.id === id);
        if(found) { target = found; foundCat = cat; }
      });
      if(!target) return;

      currentEditAgencyId = target.id;
      document.getElementById('agencyFormTitle').innerText = `修改：${target.name}`;
      document.getElementById('agCategory').value = foundCat;
      document.getElementById('agName').value = target.name || '';
      document.getElementById('agTel').value = target.tel || '';
      document.getElementById('agExtMobile').value = target.extMobile || '';
      document.getElementById('agContact').value = target.contact || '';
      document.getElementById('agAddress').value = target.address || '';
      document.getElementById('agUsageUnit').value = target.usageUnit || '';
      document.getElementById('agUsageTel').value = target.usageTel || '';
      document.getElementById('agUsageContact').value = target.usageContact || '';
      document.getElementById('agUsageAddress').value = target.usageAddress || '';
      document.getElementById('agProject').value = target.project || '';
      document.getElementById('agNote').value = target.note || '';
      
      currentAgencyCardBase64 = target.cardImg || "";
      const img = document.getElementById('agCardPreview');
      if(currentAgencyCardBase64) {
        img.src = currentAgencyCardBase64;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }

      document.getElementById('agencyDeleteBtn').classList.remove('hidden');
      switchAgencySubView('edit');
    }

    function deleteCurrentAgency() {
      if(!currentEditAgencyId || !confirm('確定要刪除這筆資料嗎？')) return;
      Object.keys(agencyData).forEach(cat => {
        agencyData[cat] = agencyData[cat].filter(x => x.id !== currentEditAgencyId);
      });
      localStorage.setItem('agency_system_data', JSON.stringify(agencyData));
      alert('已刪除！');
      switchAgencyTab(currentAgencyTab);
    }

    function renderAgencyCards() {
      const container = document.getElementById('agencyResultContainer');
      const keyword = (document.getElementById('agencySearchInput').value || '').toLowerCase();
      container.innerHTML = '';
      
      const items = agencyData[currentAgencyTab] || [];
      const filtered = items.filter(item => Object.values(item).join(' ').toLowerCase().includes(keyword));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 bg-slate-50 rounded-xl border">查無相符資料</div>`;
        return;
      }

      const groups = {};
      const noProjectItems = [];

      filtered.forEach(item => {
        const proj = (item.project || '').trim();
        if (proj) {
          if (!groups[proj]) groups[proj] = [];
          groups[proj].push(item);
        } else {
          noProjectItems.push(item);
        }
      });

      Object.keys(groups).forEach(projName => {
        const groupItems = groups[projName];
        let groupHtml = `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="border-b pb-2 flex items-center gap-2">
              <span class="w-2.5 h-5 bg-emerald-600 rounded-full inline-block"></span>
              <h3 class="font-bold text-slate-800 text-base">🏗️ 工程案場：${projName}</h3>
              <span class="text-xs bg-emerald-50 text-emerald-700 font-semibold px-2.5 py-0.5 rounded-full border">${groupItems.length} 個單位</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        `;
        groupItems.forEach(item => { groupHtml += buildCardHtml(item); });
        groupHtml += `</div></div>`;
        container.innerHTML += groupHtml;
      });

      if (noProjectItems.length > 0) {
        let singleHtml = `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="border-b pb-2 flex items-center gap-2">
              <span class="w-2.5 h-5 bg-slate-400 rounded-full inline-block"></span>
              <h3 class="font-bold text-slate-800 text-base">📂 其他未分類 / 單獨項目</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        `;
        noProjectItems.forEach(item => { singleHtml += buildCardHtml(item); });
        singleHtml += `</div></div>`;
        container.innerHTML += singleHtml;
      }
    }

    function buildCardHtml(item) {
      let html = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">`;
      html += `<div><h4 class="font-bold text-base text-slate-800 mb-2 border-b pb-2">${item.name}</h4>`;
      html += `<div class="space-y-1 text-xs text-slate-600">`;
      if(item.tel) html += `<p>📞 電話：<a href="tel:${item.tel}" class="text-emerald-600 font-medium">${item.tel}</a> ${item.extMobile ? `<span class="bg-slate-200 px-1 rounded">${item.extMobile}</span>` : ''}</p>`;
      else if(item.extMobile) html += `<p>📱 手機/分機：${item.extMobile}</p>`;
      
      if(item.contact) html += `<p>👤 聯絡人：${item.contact}</p>`;
      if(item.address) html += `<p>📍 地址：${item.address}</p>`;
      
      if(item.usageUnit) {
        html += `<div class="bg-white p-2 mt-2 rounded border border-emerald-100">`;
        html += `<p class="font-bold text-emerald-800 mb-1">▶ 使用單位：${item.usageUnit}</p>`;
        if(item.usageTel) html += `<p>📞 電話：${item.usageTel}</p>`;
        if(item.usageContact) html += `<p>👤 聯絡人：${item.usageContact}</p>`;
        if(item.usageAddress) html += `<p>📍 地址：${item.usageAddress}</p>`;
        html += `</div>`;
      }

      if(item.note) html += `<p class="mt-1 bg-amber-50 p-2 rounded border border-amber-100">💡 說明：${item.note.replace(/\n/g, '<br>')}</p>`;
      
      html += `</div></div>`;
      
      html += `<div class="mt-4 pt-3 border-t flex justify-between items-center">`;
      html += item.cardImg ? `<button onclick="openLightbox('${item.cardImg}')" class="text-xs text-emerald-600 underline">📇 查看名片</button>` : `<span></span>`;
      html += `<button onclick="editAgency('${item.id}')" class="bg-slate-800 text-white text-xs px-3 py-1 rounded">✏️ 編輯</button>`
      html += `</div></div>`;
      return html;
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('imageLightbox').classList.remove('hidden');
    }
    function closeLightbox() {
      document.getElementById('imageLightbox').classList.add('hidden');
    }

    // 初始化執行
    refreshCategoryOptions();
    refreshCodeOptions();
    filterVendors();
    fetchCloudData(); // 自動抓取雲端資料
    switchMajor('vendor');
    switchMainView('query');
  </script>
</body>
</html>
