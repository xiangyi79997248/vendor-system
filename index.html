<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>採購廠商及工程聯繫資料</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-5xl mx-auto p-4">
    <h1 class="text-xl font-bold mb-4">採購廠商系統 <span id="status" class="text-xs text-slate-500">(初始化中...)</span></h1>
    <div id="vendorList" class="grid gap-4"></div>
  </div>

  <script>
    // 您的雲端 API 網址
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwXxXu6NHVfQntAJKJaHswCExUCRYYITArdVaNR5oer5YtdplV2l85NM6Q9_uAvJBnn/exec";
    let vendors = JSON.parse(localStorage.getItem('vendor_system_data')) || [];

    // 自動同步函式 (完全相容 iOS)
    async function syncData() {
      document.getElementById('status').innerText = "同步中...";
      try {
        // 1. 先抓取雲端資料 (GET)
        const response = await fetch(CLOUD_API_URL + "?v=" + Date.now());
        const data = await response.json();
        if(data && data.length > 0) {
            vendors = data;
            localStorage.setItem('vendor_system_data', JSON.stringify(vendors));
            document.getElementById('status').innerText = "雲端同步完成";
            render();
        }
      } catch (e) {
        document.getElementById('status').innerText = "使用本機資料";
      }
    }

    // 更新雲端函式 (POST)
    async function pushToCloud() {
      document.getElementById('status').innerText = "上傳中...";
      try {
        await fetch(CLOUD_API_URL, {
          method: 'POST',
          mode: 'no-cors', // 強制放行
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(vendors)
        });
        document.getElementById('status').innerText = "雲端已儲存";
      } catch (e) {
        alert("上傳失敗，請確認網路");
      }
    }

    function render() {
      const list = document.getElementById('vendorList');
      list.innerHTML = vendors.map(v => `<div class="bg-white p-4 rounded shadow">${v.name}</div>`).join('');
    }

    // 啟動
    syncData();
    render();
  </script>
</body>
</html>
